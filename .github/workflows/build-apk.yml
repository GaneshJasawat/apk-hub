name: Build Hybrid APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --ignore-engines

      - name: Install sharp for asset generation
        run: npm install sharp --no-save

      - name: Build web app
        run: npm run build
        env:
          NITRO_PRESET: vercel
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Rebuild Capacitor Android project
        run: |
          echo "=== Installing SDK ==="
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" 2>&1 || echo "SDK install continued"
          echo "=== Init Capacitor Android ==="
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Generate custom icons & splash
        run: node resources/icon-generate.cjs

      - name: Set up Android manifest for cleartext
        run: |
          sed -i 's/android:allowBackup="true"/android:allowBackup="true" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          echo "=== Running assembleDebug ==="
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log
          echo "=== Build done ==="

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle.log
          retention-days: 7

      - name: Find and upload APK
        if: success()
        run: |
          echo "Searching for APK..."
          find android -name "*.apk" -type f
          APK=$(find android -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" apkhub-hybrid.apk
            ls -la apkhub-hybrid.apk
          else
            echo "No APK found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apkhub-hybrid-apk
          path: apkhub-hybrid.apk
          retention-days: 30
