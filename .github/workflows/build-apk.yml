name: Build Hybrid APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --ignore-engines

      - name: Install sharp for asset generation
        run: npm install sharp --no-save

      - name: Build web app
        run: npm run build
        env:
          NITRO_PRESET: vercel
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Generate PNG icon & splash assets
        run: node resources/icon-generate.cjs

      - name: Copy web build to Android
        run: npx cap copy android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" 2>&1 || echo "SDK install continued"
          echo "=== Installed SDKs ==="
          ls -la $ANDROID_HOME/platforms/
          ls -la $ANDROID_HOME/build-tools/

      - name: Build APK
        shell: bash
        run: |
          echo "=== Java ==="
          java -version
          echo "=== ANDROID_HOME: $ANDROID_HOME ==="
          echo "=== Gradle version ==="
          cd android
          chmod +x gradlew
          ./gradlew --version
          echo "=== Running assembleDebug ==="
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee ../gradle.log
          echo "=== Build succeeded ==="

      - name: Find and upload APK
        run: |
          echo "Searching for APK..."
          find android -name "*.apk" -type f 2>/dev/null || true
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk apkhub-hybrid.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug-unsigned.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug-unsigned.apk apkhub-hybrid.apk
          else
            APK=$(find android -name "*.apk" -type f 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              cp "$APK" apkhub-hybrid.apk
            else
              echo "No APK found!"
              exit 1
            fi
          fi
          ls -la apkhub-hybrid.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apkhub-hybrid-apk
          path: apkhub-hybrid.apk
          retention-days: 30
